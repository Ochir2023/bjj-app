<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BJJ Учёт</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<meta name="theme-color" content="#111">
</head>
<body>

<!-- PIN -->
<div id="pinScreen" class="card">
  <h3>Введите PIN</h3>
  <input type="password" id="pinInput">
  <button id="loginBtn">Войти</button>
</div>

<!-- APP -->
<div id="app" class="hidden">

<header>
  <div class="tabs">
    <div class="tab active" data-group="Детская">Детская</div>
    <div class="tab" data-group="Взрослая">Взрослая</div>
    <div class="tab" data-group="Женская">Женская</div>
    <div class="tab" data-group="Оплата">Оплата</div>
  </div>
  <div class="plus" id="toggleForm">＋</div>
</header>

<!-- FORM -->
<div id="formBlock" class="card hidden">
  <input id="parentInput" placeholder="ФИО родителя" list="parentsList">
  <input id="phoneInput" placeholder="Телефон родителя">
  <datalist id="parentsList"></datalist>
  <input id="studentInput" placeholder="ФИО ученика">
  <button id="addStudentBtn">Добавить</button>
</div>

<div id="list"></div>

<!-- Модальное окно -->
<div id="modal" class="hidden">
  <div class="modal-content">
    <p id="modal-text"></p>
    <div class="modal-buttons">
      <button id="modal-ok">Оплатил / Да</button>
      <button id="modal-cancel">Не оплачено / Отмена</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js')
  .then(()=>console.log('Service Worker зарегистрирован'))
  .catch(console.error);
}
</script>
</body>
</html>
