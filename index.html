<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BJJ Учёт</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111">

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f2f2f2;
}
header{
  background:#111;
  color:#fff;
  padding:12px 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.plus{
  font-size:26px;
  cursor:pointer;
}
.card{
  background:#fff;
  margin:12px;
  padding:14px;
  border-radius:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.1);
}
input,select,button{
  width:100%;
  padding:10px;
  margin-top:8px;
  font-size:16px;
  border-radius:8px;
  border:1px solid #ccc;
}
button{
  background:#111;
  color:#fff;
  border:none;
}
.hidden{display:none}
.student{
  margin-bottom:10px;
}
.paid{color:green;font-weight:bold}
.unpaid{color:red;font-weight:bold}
</style>
</head>

<body>

<!-- PIN -->
<div id="pinScreen" class="card">
  <h3>Введите PIN</h3>
  <input type="password" id="pinInput">
  <button onclick="login()">Войти</button>
</div>

<!-- APP -->
<div id="app" class="hidden">

<header>
  <div>BJJ Учёт</div>
  <div class="plus" onclick="toggleForm()">＋</div>
</header>

<!-- FORM -->
<div id="formBlock" class="card hidden">
  <select id="group">
    <option>Детская</option>
    <option>Взрослая</option>
    <option>Женская</option>
  </select>

  <input id="parent" placeholder="ФИО родителя" list="parents">
  <datalist id="parents"></datalist>

  <input id="student" placeholder="ФИО ученика">
  <button onclick="add()">Добавить</button>
</div>

<div id="list"></div>

</div>

<script>
const FIXED = 3000;

if(!localStorage.pin) localStorage.pin='1234';

let data = JSON.parse(localStorage.data || '[]');

function login(){
  if(pinInput.value===localStorage.pin){
    pinScreen.classList.add('hidden');
    app.classList.remove('hidden');
    render();
  } else alert('Неверный PIN');
}

function toggleForm(){
  formBlock.classList.toggle('hidden');
}

function save(){
  localStorage.data = JSON.stringify(data);
}

function add(){
  data.push({
    parent: parent.value,
    student: student.value,
    group: group.value,
    paid:false
  });
  parent.value='';
  student.value='';
  save();
  render();
}

function render(){
  list.innerHTML='';
  const parentsSet=new Set();
  data.forEach((s,i)=>{
    parentsSet.add(s.parent);
    const d=document.createElement('div');
    d.className='card student';
    d.innerHTML=`
      <b>${s.student}</b><br>
      Родитель: ${s.parent}<br>
      Группа: ${s.group}<br>
      <span class="${s.paid?'paid':'unpaid'}">
        ${s.paid?'Оплачено':'Не оплачено'}
      </span><br><br>
      <button onclick="pay(${i})">Оплата</button>
      <button onclick="del(${i})" style="background:#b00020">Удалить</button>
    `;
    list.appendChild(d);
  });

  parents.innerHTML='';
  parentsSet.forEach(p=>{
    const o=document.createElement('option');
    o.value=p;
    parents.appendChild(o);
  });
}

function pay(i){
  data[i].paid=!data[i].paid;
  save(); render();
}
function del(i){
  data.splice(i,1);
  save(); render();
}

</script>

</body>
</html>
