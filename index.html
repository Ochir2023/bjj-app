<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BJJ Учёт</title>

<style>
body { margin:0; font-family:Arial; background:#f2f2f2 }
.hidden { display:none !important }
.screen { padding:20px }

header { display:flex; align-items:center; justify-content:space-between; gap:6px; }
.tabs { display:flex; flex-wrap:wrap; gap:6px; }
.tabs button { padding:6px 8px; font-size:13px; cursor:pointer; }
.plus { font-size:22px; padding:4px 10px; cursor:pointer; }

.card { background:#fff; padding:12px; border-radius:10px; margin-top:10px; }

.modal { position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; }
.modal-content { background:#fff; padding:16px; border-radius:12px; width:90%; max-width:360px; }
.modal-content input, .modal-content button, .modal-content select { width:100%; margin-top:8px; padding:8px; }

.actions { display:flex; gap:6px; margin-top:8px; }
.actions button { flex:1; }

.delete { background:#b00020; color:#fff; border:none; }
.pay { background:#111; color:#fff; border:none; }
.edit { background:#0a74da; color:#fff; border:none; }

.paid { color:green; font-weight:bold; }
.unpaid { color:red; font-weight:bold; }

.small { font-size:12px; color:#666; margin-top:6px; }
.row { display:flex; gap:8px; align-items:center; }
.row > * { flex:1; }
hr { border:none; border-top:1px solid #eee; margin:10px 0; }
</style>
</head>

<body>

<!-- PIN -->
<div id="pinScreen" class="screen">
  <h2>Введите PIN-код</h2>
  <input id="pinInput" placeholder="PIN" type="password">
  <button onclick="checkPin()">Войти</button>
</div>

<!-- APP -->
<div id="appScreen" class="screen hidden">

<header>
  <div class="tabs">
    <button onclick="setMainTab('Детская')">Детская</button>
    <button onclick="setMainTab('Взрослая')">Взрослая</button>
    <button onclick="setMainTab('Женская')">Женская</button>
    <button onclick="setMainTab('Оплата')">Оплата</button>
  </div>
  <button class="plus" onclick="openAdd()">＋</button>
</header>

<div id="list"></div>

<!-- МОДАЛКА ДОБАВЛЕНИЯ -->
<div id="modalAdd" class="modal hidden">
  <div class="modal-content">
    <h3>Добавить</h3>

    <div class="card" style="margin:0; padding:8px;">
      <div class="small">Группа записи: <b id="addGroupLabel">Детская</b></div>
    </div>

    <div id="addParentFields">
      <input id="addParentName" placeholder="ФИО родителя">
    </div>

    <input id="addPhone" placeholder="Телефон">
    <input id="addStudentName" placeholder="ФИО ученика/спортсмена">

    <button onclick="saveNewStudent()">Сохранить</button>
    <button onclick="closeAdd()">Отмена</button>
  </div>
</div>

<!-- МОДАЛКА ОПЛАТЫ (с выбором месяца) -->
<div id="modalPay" class="modal hidden">
  <div class="modal-content">
    <h3>Оплата</h3>
    <p id="payPrompt" class="small"></p>

    <div class="small">Месяц</div>
    <select id="payMonthSelect"></select>

    <div class="actions" style="margin-top:10px;">
      <button class="pay" onclick="confirmPay(true)">Оплатил</button>
      <button class="delete" onclick="confirmPay(false)">Не оплатил</button>
    </div>

    <button onclick="closePay()">Отмена</button>
  </div>
</div>

<!-- МОДАЛКА РЕДАКТИРОВАНИЯ -->
<div id="modalEdit" class="modal hidden">
  <div class="modal-content">
    <h3>Редактировать</h3>

    <div class="small">Группа</div>
    <select id="editGroup">
      <option>Детская</option>
      <option>Взрослая</option>
      <option>Женская</option>
    </select>

    <div id="editParentFields">
      <input id="editParentName" placeholder="ФИО родителя">
    </div>

    <input id="editPhone" placeholder="Телефон">
    <input id="editName" placeholder="ФИО ученика/спортсмена">

    <button class="edit" onclick="saveEdit()">Сохранить изменения</button>
    <button onclick="closeEdit()">Отмена</button>
  </div>
</div>

<!-- МОДАЛКА УДАЛЕНИЯ -->
<div id="modalDelete" class="modal hidden">
  <div class="modal-content">
    <p id="deletePrompt">Удалить ученика?</p>
    <button class="delete" onclick="confirmDelete()">Удалить</button>
    <button onclick="closeDelete()">Отмена</button>
  </div>
</div>

</div>

<script>
/* === НАСТРОЙКИ === */
const PIN = "1234";
const PRICE = 3000;
const MONTHS = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];

/* === СОСТОЯНИЕ === */
let mainTab = "Детская";
let payGroupTab = "Детская";
let selectedMonthIndex = new Date().getMonth();
let students = JSON.parse(localStorage.getItem("bjj_students")) || [];

let payId = null;
let delId = null;
let editId = null;

/* === DOM === */
const pinScreen = document.getElementById("pinScreen");
const appScreen = document.getElementById("appScreen");
const list = document.getElementById("list");

const modalAdd = document.getElementById("modalAdd");
const modalPay = document.getElementById("modalPay");
const modalEdit = document.getElementById("modalEdit");
const modalDelete = document.getElementById("modalDelete");

/* === УТИЛИТЫ === */
function uid(){
  return (crypto?.randomUUID ? crypto.randomUUID() : (Date.now().toString(36)+Math.random().toString(36).slice(2)));
}
function escapeHtml(str){
  return String(str ?? "").replace(/[&<>"']/g, m => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[m]));
}
function save(){ localStorage.setItem("bjj_students", JSON.stringify(students)); }
function findIndexById(id){ return students.findIndex(s=>s.id===id); }
function paidFor(s, mi){ return !!(s.payments && s.payments[mi]); }

/* === МИГРАЦИЯ СТАРЫХ ДАННЫХ === */
(function migrate(){
  const nowMonth = new Date().getMonth();
  students = students.map(s=>{
    const id = s.id || uid();
    const group = s.group || "Детская";
    const parent = s.parent || "";
    const phone = s.phone || "";
    const name = s.name || s.student || "";
    const payments = (s.payments && typeof s.payments === "object") ? s.payments : {};
    if(typeof s.paid === "boolean") payments[nowMonth] = s.paid;
    return { id, group, parent, phone, name, payments };
  });
  save();
})();

/* === ВХОД === */
function checkPin() {
  if (pinInput.value === PIN) {
    pinScreen.classList.add("hidden");
    appScreen.classList.remove("hidden");
    closeAllModals();
    render();
  } else {
    alert("Неверный PIN");
  }
}

/* === ВКЛАДКИ === */
function setMainTab(tab){ mainTab = tab; render(); }
function setPayGroup(g){ payGroupTab = g; render(); }
function setMonth(v){ selectedMonthIndex = Number(v); render(); }

/* === РЕНДЕР === */
function render(){
  list.innerHTML = "";

  if(mainTab === "Оплата"){
    renderPaymentsTab();
    return;
  }

  const filtered = students.filter(s=>s.group === mainTab);

  const head = document.createElement("div");
  head.className = "card";
  head.innerHTML = `<b>${escapeHtml(mainTab)}</b>
    <div class="small">Статус оплаты за: <b>${MONTHS[selectedMonthIndex]}</b></div>`;
  list.appendChild(head);

  filtered.forEach(s=>{
    const paid = paidFor(s, selectedMonthIndex);

    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `
      <b>${escapeHtml(s.name)}</b><br>
      ${s.parent ? "Родитель: "+escapeHtml(s.parent)+"<br>" : ""}
      Тел: ${escapeHtml(s.phone)}<br>
      ${MONTHS[selectedMonthIndex]}:
      <span class="${paid?'paid':'unpaid'}">${paid?'Оплачено':'Не оплачено'}</span>

      <div class="actions">
        <button class="pay" onclick="openPay('${s.id}')">Оплата</button>
        <button class="edit" onclick="openEdit('${s.id}')">Редактировать</button>
        <button class="delete" onclick="openDelete('${s.id}')">Удалить</button>
      </div>
    `;
    list.appendChild(div);
  });
}

/* === ВКЛАДКА ОПЛАТА === */
function renderPaymentsTab(){
  const wrap = document.createElement("div");
  wrap.className = "card";

  const monthOptions = MONTHS.map((m,i)=>`<option value="${i}" ${i===selectedMonthIndex?'selected':''}>${m}</option>`).join("");

  const groupTabs = ["Детская","Взрослая","Женская"].map(g=>`
    <button onclick="setPayGroup('${g}')" ${g===payGroupTab?'style="background:#111;color:#fff"':''}>${g}</button>
  `).join("");

  wrap.innerHTML = `
    <b>Оплата</b>
    <div class="small">Фиксированная оплата: <b>${PRICE} ₽</b></div>

    <div class="row" style="margin-top:10px;">
      <div>
        <div class="small">Месяц</div>
        <select onchange="setMonth(this.value)">${monthOptions}</select>
      </div>
    </div>

    <div class="small" style="margin-top:10px;">Группа</div>
    <div class="tabs" style="margin-top:6px;">${groupTabs}</div>
  `;
  list.appendChild(wrap);

  const groupList = students.filter(s=>s.group===payGroupTab);

  let groupSum = 0;
  let totalSum = 0;

  students.forEach(s=>{ if(paidFor(s, selectedMonthIndex)) totalSum += PRICE; });
  groupList.forEach(s=>{ if(paidFor(s, selectedMonthIndex)) groupSum += PRICE; });

  // кто не оплатил
  const unpaidList = groupList.filter(s=>!paidFor(s, selectedMonthIndex));
  const paidList = groupList.filter(s=>paidFor(s, selectedMonthIndex));

  const sumCard = document.createElement("div");
  sumCard.className = "card";
  sumCard.innerHTML = `
    <b>Итоги за ${MONTHS[selectedMonthIndex]}</b><br>
    Группа "${escapeHtml(payGroupTab)}": <b>${groupSum} ₽</b><br>
    Общий итог (все группы): <b>${totalSum} ₽</b>
  `;
  list.appendChild(sumCard);

  const unpaidCard = document.createElement("div");
  unpaidCard.className = "card";
  unpaidCard.innerHTML = `<b>Не оплатили</b><div class="small">${MONTHS[selectedMonthIndex]}</div>` +
    (unpaidList.length ? "" : `<div class="small">Все оплатили ✅</div>`);
  list.appendChild(unpaidCard);

  unpaidList.forEach(s=>list.appendChild(studentPayCard(s)));
  if(unpaidList.length && paidList.length){
    const hr = document.createElement("hr");
    list.appendChild(hr);
  }

  const paidCard = document.createElement("div");
  paidCard.className = "card";
  paidCard.innerHTML = `<b>Оплатили</b><div class="small">${MONTHS[selectedMonthIndex]}</div>` +
    (paidList.length ? "" : `<div class="small">Пока нет оплат</div>`);
  list.appendChild(paidCard);

  paidList.forEach(s=>list.appendChild(studentPayCard(s)));
}

function studentPayCard(s){
  const paid = paidFor(s, selectedMonthIndex);
  const div = document.createElement("div");
  div.className = "card";
  div.innerHTML = `
    <b>${escapeHtml(s.name)}</b><br>
    ${s.parent ? "Родитель: "+escapeHtml(s.parent)+"<br>" : ""}
    Тел: ${escapeHtml(s.phone)}<br>
    ${MONTHS[selectedMonthIndex]}:
    <span class="${paid?'paid':'unpaid'}">${paid?'Оплачено':'Не оплачено'}</span>

    <div class="actions">
      <button class="pay" onclick="openPay('${s.id}')">${paid?'Снять':'Оплатил'}</button>
      <button class="edit" onclick="openEdit('${s.id}')">Редактировать</button>
      <button class="delete" onclick="openDelete('${s.id}')">Удалить</button>
    </div>
  `;
  return div;
}

/* === ДОБАВЛЕНИЕ === */
function openAdd(){
  const addGroup = (mainTab === "Оплата") ? payGroupTab : mainTab;
  modalAdd.dataset.addGroup = addGroup;

  addGroupLabel.textContent = addGroup;
  addParentFields.style.display = (addGroup === "Детская") ? "block" : "none";
  addStudentName.placeholder = (addGroup === "Детская") ? "ФИО ученика" : "ФИО спортсмена";

  modalAdd.classList.remove("hidden");
}
function closeAdd(){ modalAdd.classList.add("hidden"); }

function saveNewStudent(){
  const addGroup = modalAdd.dataset.addGroup || "Детская";
  const parent = addParentName.value.trim();
  const phoneVal = addPhone.value.trim();
  const nameVal = addStudentName.value.trim();

  if(addGroup === "Детская" && (!parent || !nameVal)){
    alert("Для детской группы заполните ФИО родителя и ФИО ученика.");
    return;
  }
  if(addGroup !== "Детская" && !nameVal){
    alert("Заполните ФИО спортсмена.");
    return;
  }
  if(!phoneVal){
    alert("Заполните телефон.");
    return;
  }

  students.push({
    id: uid(),
    group: addGroup,
    parent: addGroup === "Детская" ? parent : "",
    phone: phoneVal,
    name: nameVal,
    payments: {}
  });

  addParentName.value = "";
  addPhone.value = "";
  addStudentName.value = "";

  save();
  closeAdd();
  render();
}

/* === ОПЛАТА (модалка с выбором месяца) === */
function fillPayMonthSelect(selected){
  payMonthSelect.innerHTML = MONTHS.map((m,i)=>`<option value="${i}" ${i===selected?'selected':''}>${m}</option>`).join("");
}
function openPay(id){
  payId = id;
  const idx = findIndexById(id);
  if(idx === -1) return;

  fillPayMonthSelect(selectedMonthIndex);

  const s = students[idx];
  const paid = paidFor(s, selectedMonthIndex);
  payPrompt.textContent = `Ученик: "${s.name}". Сейчас за ${MONTHS[selectedMonthIndex]}: ${paid ? "ОПЛАЧЕНО" : "НЕ ОПЛАЧЕНО"}. Выберите месяц и подтвердите.`;

  modalPay.classList.remove("hidden");
}

function confirmPay(v){
  const idx = findIndexById(payId);
  if(idx === -1){ closePay(); return; }

  const mi = Number(payMonthSelect.value);
  if(!students[idx].payments) students[idx].payments = {};
  students[idx].payments[mi] = v;

  save();
  closePay();
  render();
}
function closePay(){
  modalPay.classList.add("hidden");
  payId = null;
}

/* === РЕДАКТИРОВАНИЕ === */
function openEdit(id){
  editId = id;
  const idx = findIndexById(id);
  if(idx === -1) return;

  const s = students[idx];
  editGroup.value = s.group;
  editPhone.value = s.phone;
  editName.value = s.name;
  editParentName.value = s.parent || "";

  editParentFields.style.display = (s.group === "Детская") ? "block" : "none";

  modalEdit.classList.remove("hidden");
}

editGroup.addEventListener("change", ()=>{
  const g = editGroup.value;
  editParentFields.style.display = (g === "Детская") ? "block" : "none";
  if(g !== "Детская") editParentName.value = "";
});

function saveEdit(){
  const idx = findIndexById(editId);
  if(idx === -1){ closeEdit(); return; }

  const g = editGroup.value;
  const phoneVal = editPhone.value.trim();
  const nameVal = editName.value.trim();
  const parentVal = editParentName.value.trim();

  if(!phoneVal){ alert("Заполните телефон."); return; }
  if(!nameVal){ alert("Заполните ФИО."); return; }
  if(g === "Детская" && !parentVal){ alert("Для детской группы заполните ФИО родителя."); return; }

  students[idx].group = g;
  students[idx].phone = phoneVal;
  students[idx].name = nameVal;
  students[idx].parent = (g === "Детская") ? parentVal : "";

  save();
  closeEdit();
  render();
}
function closeEdit(){
  modalEdit.classList.add("hidden");
  editId = null;
}

/* === УДАЛЕНИЕ === */
function openDelete(id){
  delId = id;
  const idx = findIndexById(id);
  if(idx === -1) return;

  deletePrompt.textContent = `Удалить ученика "${students[idx].name}"?`;
  modalDelete.classList.remove("hidden");
}
function confirmDelete(){
  const idx = findIndexById(delId);
  if(idx === -1){ closeDelete(); return; }

  students.splice(idx,1);
  save();
  closeDelete();
  render();
}
function closeDelete(){
  modalDelete.classList.add("hidden");
  delId = null;
}

/* === ОБЩЕЕ === */
function closeAllModals(){
  modalAdd.classList.add("hidden");
  modalPay.classList.add("hidden");
  modalEdit.classList.add("hidden");
  modalDelete.classList.add("hidden");
}

/* === СТАРТ === */
closeAllModals();
</script>

</body>
</html>
