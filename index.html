<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BJJ PWA</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <style>
    body{font-family:Arial;background:#f2f2f2;margin:0;padding:12px}
    h1{text-align:center;font-size:22px}
    input,button,select{width:100%;padding:10px;margin-top:6px;font-size:16px;border-radius:8px;border:1px solid #ccc}
    button{background:#111;color:#fff;border:none;margin-top:10px}
    .card{background:#fff;padding:14px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.1);margin-bottom:12px}
    .row{font-size:14px;margin:3px 0}
    .actions{display:flex;gap:6px;margin-top:8px}
    .actions button{flex:1}
    .delete{background:#b00020}
    .paid{color:green;font-weight:bold}
    .unpaid{color:red;font-weight:bold}
    .hidden{display:none !important}
    .tabs{display:flex;gap:6px;margin-bottom:6px}
    .tab{flex:1;text-align:center;padding:6px;background:#ddd;border-radius:6px;cursor:pointer}
    .tab.active{background:#111;color:#fff}
    #header{display:flex;justify-content:space-between;align-items:center}
    #toggleForm{background:#0a74da;padding:8px;border-radius:8px;cursor:pointer}
    #modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:flex;justify-content:center;align-items:center;z-index:1000}
    .modal-content{background:#fff;padding:20px;border-radius:12px;min-width:280px}
    .modal-buttons{display:flex;gap:6px;margin-top:12px}
    .modal-buttons button{flex:1}
  </style>
</head>
<body>

<div id="pinScreen" class="card">
  <h1>BJJ — Учёт учеников</h1>
  <input type="password" id="pinInput" placeholder="Введите PIN" />
  <button id="loginBtn">Войти</button>
</div>

<div id="app" class="hidden">

  <div id="header">
    <div class="tabs">
      <div class="tab active" data-group="Детская">Детская</div>
      <div class="tab" data-group="Взрослая">Взрослая</div>
      <div class="tab" data-group="Женская">Женская</div>
    </div>
    <div id="toggleForm">+</div>
  </div>

  <div id="formBlock" class="hidden card">
    <div id="parentField">
      <input id="parentInput" placeholder="ФИО родителя" />
      <input id="phoneInput" placeholder="Телефон" />
    </div>
    <input id="studentInput" placeholder="ФИО ученика/спортсмена" />
    <button id="addStudentBtn">Добавить</button>
  </div>

  <div id="list"></div>
</div>

<!-- Модальное окно -->
<div id="modal" class="hidden">
  <div class="modal-content">
    <p id="modal-text"></p>
    <div class="modal-buttons">
      <button id="modal-ok">Да / Оплатил</button>
      <button id="modal-cancel">Отмена / Не оплачено</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
