<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BJJ Учёт</title>

<style>
body { margin:0; font-family:Arial; background:#f2f2f2 }
.hidden { display:none !important }
.screen { padding:20px }

header { display:flex; align-items:center; justify-content:space-between; gap:6px; }
.tabs { display:flex; flex-wrap:wrap; gap:6px; }
.tabs button { padding:6px 8px; font-size:13px; }

.plus { font-size:22px; padding:4px 10px; }

.card { background:#fff; padding:12px; border-radius:10px; margin-top:10px; }

.modal { position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; }
.modal-content { background:#fff; padding:16px; border-radius:12px; width:90%; max-width:320px; }
.modal-content input, .modal-content button, .modal-content select { width:100%; margin-top:8px; padding:8px; }

.actions { display:flex; gap:6px; margin-top:8px; }
.actions button { flex:1; }

.delete { background:#b00020; color:#fff; border:none; }
.pay { background:#111; color:#fff; border:none; }

.paid { color:green; font-weight:bold; }
.unpaid { color:red; font-weight:bold; }
</style>
</head>

<body>

<!-- PIN -->
<div id="pinScreen" class="screen">
  <h2>Введите PIN-код</h2>
  <input id="pinInput" placeholder="PIN">
  <button onclick="checkPin()">Войти</button>
</div>

<!-- APP -->
<div id="appScreen" class="screen hidden">

<header>
  <div class="tabs">
    <button onclick="setGroup('Детская')">Детская</button>
    <button onclick="setGroup('Взрослая')">Взрослая</button>
    <button onclick="setGroup('Женская')">Женская</button>
    <button onclick="setGroup('Оплата')">Оплата</button>
  </div>
  <button class="plus" onclick="openAdd()">＋</button>
</header>

<div id="list"></div>

<!-- МОДАЛКА ДОБАВЛЕНИЯ -->
<div id="modalAdd" class="modal hidden">
  <div class="modal-content">
    <h3>Добавить</h3>

    <div class="card" style="margin:0; padding:8px;">
      <div style="font-size:12px;color:#555;">Группа записи: <b id="groupLabel">Детская</b></div>
    </div>

    <div id="parentFields">
      <input id="parentName" placeholder="ФИО родителя">
    </div>

    <input id="phone" placeholder="Телефон">
    <input id="studentName" placeholder="ФИО ученика/спортсмена">

    <button onclick="saveStudent()">Сохранить</button>
    <button onclick="closeAdd()">Отмена</button>
  </div>
</div>

<!-- МОДАЛКА ОПЛАТЫ -->
<div id="modalPay" class="modal hidden">
  <div class="modal-content">
    <p id="payPrompt">Отметить оплату?</p>
    <button onclick="confirmPay(true)">Оплатил</button>
    <button onclick="confirmPay(false)">Не оплатил</button>
    <button onclick="closePay()">Отмена</button>
  </div>
</div>

<!-- МОДАЛКА УДАЛЕНИЯ -->
<div id="modalDelete" class="modal hidden">
  <div class="modal-content">
    <p id="deletePrompt">Удалить ученика?</p>
    <button class="delete" onclick="confirmDelete()">Удалить</button>
    <button onclick="closeDelete()">Отмена</button>
  </div>
</div>

</div>

<script>
/* === НАСТРОЙКИ === */
const PIN = "1234";
const PRICE = 3000;

/* === СОСТОЯНИЕ === */
let group = "Детская";
let students = JSON.parse(localStorage.getItem("bjj_students")) || [];

/* миграция старых записей: добавим id и payments */
students = students.map(s => ({
  id: s.id || (crypto?.randomUUID ? crypto.randomUUID() : (Date.now().toString(36)+Math.random().toString(36).slice(2))),
  group: s.group || "Детская",
  parent: s.parent || "",
  phone: s.phone || "",
  name: s.name || s.student || "",
  paid: !!s.paid
}));

let payId = null;
let delId = null;

/* === ЭЛЕМЕНТЫ === */
const pinScreen = document.getElementById("pinScreen");
const appScreen = document.getElementById("appScreen");
const list = document.getElementById("list");

const modalAdd = document.getElementById("modalAdd");
const modalPay = document.getElementById("modalPay");
const modalDelete = document.getElementById("modalDelete");

function save(){
  localStorage.setItem("bjj_students", JSON.stringify(students));
}

/* === ВХОД === */
function checkPin() {
  if (pinInput.value === PIN) {
    pinScreen.classList.add("hidden");
    appScreen.classList.remove("hidden");
    closeAllModals();
    render();
  } else {
    alert("Неверный PIN");
  }
}

/* === ГРУППЫ === */
function setGroup(g) {
  group = g;
  render();
}

/* === ПОИСК ПО ID === */
function findIndexById(id){
  return students.findIndex(s => s.id === id);
}

/* === РЕНДЕР === */
function render() {
  list.innerHTML = "";

  if (group === "Оплата") {
    renderPayments();
    return;
  }

  const filtered = students.filter(s => s.group === group);

  filtered.forEach((s) => {
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `
      <b>${escapeHtml(s.name)}</b><br>
      ${s.parent ? "Родитель: " + escapeHtml(s.parent) + "<br>" : ""}
      Тел: ${escapeHtml(s.phone)}<br>
      <span class="${s.paid ? 'paid' : 'unpaid'}">
        ${s.paid ? 'Оплачено' : 'Не оплачено'}
      </span>

      <div class="actions">
        <button class="pay" onclick="openPay('${s.id}')">Оплата</button>
        <button class="delete" onclick="openDelete('${s.id}')">Удалить</button>
      </div>
    `;
    list.appendChild(div);
  });

  save();
}

/* === ДОБАВЛЕНИЕ === */
function openAdd() {
  groupLabel.textContent = group;
  parentFields.style.display = (group === "Детская") ? "block" : "none";
  studentName.placeholder = (group === "Детская") ? "ФИО ученика" : "ФИО спортсмена";
  modalAdd.classList.remove("hidden");
}
function closeAdd(){ modalAdd.classList.add("hidden"); }

function saveStudent() {
  const parent = parentName.value.trim();
  const phoneVal = phone.value.trim();
  const nameVal = studentName.value.trim();

  if(group === "Детская" && (!parent || !nameVal)){
    alert("Для детской группы заполните ФИО родителя и ФИО ученика.");
    return;
  }
  if(group !== "Детская" && !nameVal){
    alert("Заполните ФИО спортсмена.");
    return;
  }

  students.push({
    id: crypto?.randomUUID ? crypto.randomUUID() : (Date.now().toString(36)+Math.random().toString(36).slice(2)),
    group,
    parent: group === "Детская" ? parent : "",
    phone: phoneVal,
    name: nameVal,
    paid: false
  });

  parentName.value = "";
  phone.value = "";
  studentName.value = "";

  save();
  closeAdd();
  render();
}

/* === ОПЛАТА === */
function openPay(id){
  payId = id;
  const idx = findIndexById(id);
  if(idx === -1) return;

  payPrompt.textContent = `Отметить оплату: "${students[idx].name}"?`;
  modalPay.classList.remove("hidden");
}

function confirmPay(v){
  const idx = findIndexById(payId);
  if(idx === -1) { closePay(); return; }

  students[idx].paid = v;
  save();
  closePay();
  render();
}
function closePay(){ modalPay.classList.add("hidden"); payId = null; }

/* === УДАЛЕНИЕ === */
function openDelete(id){
  delId = id;
  const idx = findIndexById(id);
  if(idx === -1) return;

  deletePrompt.textContent = `Удалить ученика "${students[idx].name}"?`;
  modalDelete.classList.remove("hidden");
}

function confirmDelete(){
  const idx = findIndexById(delId);
  if(idx === -1) { closeDelete(); return; }

  students.splice(idx,1);
  save();
  closeDelete();
  render();
}
function closeDelete(){ modalDelete.classList.add("hidden"); delId = null; }

/* === ВКЛАДКА ОПЛАТА (сводка по группам) === */
function renderPayments(){
  let html = "";
  ["Детская","Взрослая","Женская"].forEach(g=>{
    let sum = 0;
    const rows = students.filter(s=>s.group===g).map(s=>{
      if(s.paid) sum += PRICE;
      return `<div style="margin-top:6px;">
        <b>${escapeHtml(s.name)}</b> — <span class="${s.paid?'paid':'unpaid'}">${s.paid?'✔ Оплачено':'✖ Не оплачено'}</span>
        <div class="actions">
          <button class="pay" onclick="openPay('${s.id}')">${s.paid?'Снять':'Оплатил'}</button>
          <button class="delete" onclick="openDelete('${s.id}')">Удалить</button>
        </div>
      </div>`;
    }).join("");

    html += `<div class="card">
      <b>${g}</b><br>
      <div style="margin-top:6px;">Итого за группу: <b>${sum} ₽</b></div>
      ${rows || "<div style='margin-top:6px;color:#666;'>Нет учеников</div>"}
    </div>`;
  });

  list.innerHTML = html;
}

/* === ОБЩЕЕ === */
function closeAllModals(){
  modalAdd.classList.add("hidden");
  modalPay.classList.add("hidden");
  modalDelete.classList.add("hidden");
}

/* защита от вставки HTML */
function escapeHtml(str){
  return String(str ?? "").replace(/[&<>"']/g, m => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[m]));
}

/* === СТАРТ === */
closeAllModals();
save();
</script>

</body>
</html>
