<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>BJJ Ученики</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- СТРАНИЦА PIN -->
<div id="pinScreen" class="screen">
  <h2>Введите PIN-код</h2>
  <input type="password" id="pinInput" placeholder="PIN">
  <button onclick="checkPin()">Войти</button>
</div>

<!-- ОСНОВНОЕ ПРИЛОЖЕНИЕ -->
<div id="appScreen" class="screen hidden">

  <!-- HEADER -->
  <header>
    <div class="tabs">
      <button onclick="setGroup('Детская')">Детская</button>
      <button onclick="setGroup('Взрослая')">Взрослая</button>
      <button onclick="setGroup('Женская')">Женская</button>
    </div>
    <button class="plus" onclick="openAddModal()">＋</button>
  </header>

  <!-- СПИСОК -->
  <div id="list"></div>
</div>

<!-- МОДАЛКА ДОБАВЛЕНИЯ -->
<div id="addModal" class="modal hidden">
  <div class="modal-content">
    <h3 id="modalTitle">Добавить</h3>

    <input id="parentName" placeholder="ФИО родителя">
    <input id="parentPhone" placeholder="Телефон">

    <input id="studentName" placeholder="ФИО ученика">

    <button onclick="saveStudent()">Сохранить</button>
    <button onclick="closeAddModal()">Отмена</button>
  </div>
</div>
<div id="appScreen" class="screen hidden">
<!-- МОДАЛКА УДАЛЕНИЯ -->
<div id="confirmDelete" class="modal hidden">
  <div class="modal-content">
    <p>Удалить ученика?</p>
    <button onclick="confirmDeleteYes()">Удалить</button>
    <button onclick="closeDelete()">Нет</button>
  </div>
</div>
  
</div>

<script src="app.js"></script>
</body>
</html>
