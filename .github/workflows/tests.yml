name: Data safety and application regression
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node tests/data-store.test.cjs
      - run: node tests/finance.test.cjs
      - run: node tests/groups.test.cjs
      - run: python -m pip install -r requirements-test.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_test.py
      - run: python tests/financial_browser_test.py
      - run: python tests/mobile_browser_test.py
